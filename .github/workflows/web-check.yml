name: Web checks
on:
  push:
    branches: [web]
    paths: ['docs/**', 'tests/**', '.github/workflows/web-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --check docs/app.mjs && node --check docs/sw.js
