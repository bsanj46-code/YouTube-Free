name: YouTube Free APK
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-free-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build universal APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace -DskipFormatKtlint -DversionCodeOverride=$((200000 + GITHUB_RUN_NUMBER))
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-APK
          path: unsigned
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Sign and verify APK
        env:
          KEYSTORE_B64: ${{ secrets.YT_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YT_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::APK built. Publication requires the owner's approval to store the signing key in repository secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/youtube-free.jks"
          mkdir -p dist
          TOOLS="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          TOOLS="$(dirname "$TOOLS")"
          "$TOOLS/zipalign" -p -f 4 unsigned/*.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/youtube-free.jks" --ks-key-alias youtubefree --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out dist/YouTube-Free.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs dist/YouTube-Free.apk
          sha256sum dist/YouTube-Free.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Free-APK
          path: dist/*
          if-no-files-found: error
      - name: Publish permanent APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="youtube-free-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/YouTube-Free.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "YouTube Free · build ${GITHUB_RUN_NUMBER}" --notes "Personal GPL-3.0-or-later fork of NewPipe 0.29.3. Source corresponds to this tag. Universal Android APK for phones and tablets. Not an official YouTube or NewPipe release." --latest
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/youtube-free.jks"
